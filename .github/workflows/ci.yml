
name: Intelligent Data Quality Pipeline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    name: Python Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Run automated tests
        run: python -m pytest -v

  docker:
    name: Docker Build and Verification
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --load \
            --build-arg OFFLINE_INSTALL=false \
            --tag intelligent-data-quality:ci \
            .

      - name: Verify Docker dependencies
        run: |
          docker run --rm intelligent-data-quality:ci \
            python -m pip check

      - name: Run tests inside Docker
        run: |
          docker run --rm intelligent-data-quality:ci \
            python -m pytest -v

      - name: Start API container
        run: |
          docker run -d \
            --name data-quality-api-ci \
            -p 127.0.0.1:8000:8000 \
            intelligent-data-quality:ci \
            python -m uvicorn api.main:app \
            --host 0.0.0.0 \
            --port 8000

      - name: Verify API health
        run: |
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-delay 2 \
            --retry-connrefused \
            --max-time 5 \
            http://localhost:8000/health

      - name: Display container logs
        if: always()
        run: |
          docker logs data-quality-api-ci || true

      - name: Clean up container
        if: always()
        run: |
          docker rm -f data-quality-api-ci || true
